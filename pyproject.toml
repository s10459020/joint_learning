[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "joint-learning"
version = "1.0.0"
description = "Research code for joint learning of action-space constraints and state correction in offline reinforcement learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch>=2.5",
    "gymnasium[mujoco]>=1.0",
    "h5py",
    "huggingface-hub",
    "matplotlib",
]

[tool.setuptools.packages.find]
include = ["joint_learning*"]
